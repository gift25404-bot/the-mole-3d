<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10151b" />
  <title>THE MOLE — Night at Blackwood House</title>
</head>
<body>
  <div id="game">
    <div class="topbar">
      <div class="brand"><span class="sigil">M</span><div><b>THE MOLE</b><small>THE BROKEN BUS • NIGHT 01</small></div></div>
      <div class="status">
  <span class="live-dot"></span> BUS ARRIVAL
  <span id="phase">GATHERING</span>
  <button id="online">ONLINE LOBBY</button>
</div>
    </div>
    <div id="crosshair">＋</div>
    <div class="hud-left"><div class="tag">YOUR CHARACTER</div><b id="player-name">ALEX</b><small id="role-label">PASSENGER</small></div>
    <div class="hud-right"><div class="tag">HOUSE STATUS</div><b id="house-status">POWER: UNSTABLE</b><small>Rain outside • 11:48 PM</small></div>
    <div id="prompt" class="prompt">WASD move <i>•</i> E interact <i>•</i> C camera</div>
    <div class="bottom">
      <div class="controls"><kbd>W A S D</kbd> MOVE <kbd>SHIFT</kbd> RUN <kbd>E</kbd> INTERACT</div>
      <div class="actions"><button id="camera">CAMERA: ISOMETRIC</button><button id="map">HOUSE MAP</button><button id="ability">ROLE ABILITY</button><button id="start-vote">CALL A MEETING</button></div>
    </div>
    <div id="notice" class="notice"></div>
    <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="close-modal">×</button><div class="eyebrow">BLACKWOOD HOUSE</div><h2 id="modal-title">HOUSE MAP</h2><p id="modal-copy"></p><div id="modal-content"></div></div></div>
    <div class="mobile-pad"><button data-key="w">▲</button><div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
